<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bambina</title>
    <style>
      :root {
        --pink: #f7c9d4;
        --pink-deep: #e79fb3;
        --ink: #7f4f61;
        --muted: #9a6a7a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.45), transparent 32%),
          radial-gradient(circle at bottom right, rgba(231, 159, 179, 0.32), transparent 30%),
          linear-gradient(180deg, #fbe1e7 0%, var(--pink) 100%);
        font-family: "Georgia", "Times New Roman", serif;
        color: var(--ink);
      }
      main {
        width: min(92vw, 700px);
        text-align: center;
        padding: 32px 24px;
      }
      h1 {
        margin: 0;
        font-size: clamp(84px, 20vw, 210px);
        line-height: 0.88;
        font-weight: 600;
        letter-spacing: -0.06em;
        text-transform: lowercase;
      }
      p {
        margin: 18px 0 0;
        font-size: clamp(18px, 3.5vw, 28px);
        color: var(--muted);
      }
      a {
        display: inline-block;
        margin-top: 30px;
        text-decoration: none;
        color: var(--ink);
        border-bottom: 1px solid rgba(127, 79, 97, 0.35);
        padding-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>bambina</h1>
      <p>by openbox</p>
        <a href="exp://192.168.4.41:8083">open in expo go</a>
    </main>
    <script>
      window.setTimeout(() => {
        window.location.href = "exp://192.168.4.41:8083";
      }, 180);
    </script>
  </body>
  </html>
