name: Push Notifications

on:
  push:
    branches:
      - main

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secret
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "Missing DISCORD_WEBHOOK_URL secret"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Post push notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PUSH_REF: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_COMPARE_URL: ${{ github.event.compare }}
          PUSH_COMMIT_URL: ${{ github.event.head_commit.url }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
          PUSH_AUTHOR: ${{ github.event.head_commit.author.name }}
          PUSHER_NAME: ${{ github.actor }}
        run: node ./scripts/post-push-to-discord.mjs
